
name: Deploy Frontend To VPS

on:
  push:
    branches:
      - v2_frontend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            echo "Starting deployment..."

            # Go to frontend project folder
            cd /home/mohamed/apps/residence_siby/frontend

            # Synchronize with remote branch
            git fetch origin v2_frontend
            git checkout v2_frontend
            git reset --hard origin/v2_frontend

            echo "Git synchronization successful."

            # Install dependencies
            npm ci

            # Build frontend
            npm run build

            echo "Frontend build successful."

            # Test Nginx configuration
            sudo nginx -t

            # Reload Nginx
            sudo systemctl reload nginx

            echo "Deployment completed successfully!"
